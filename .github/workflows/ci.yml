name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tests share one Neon test branch, so never run two workflows at once.
concurrency:
  group: ci-test-database
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Neon "test" branch. Stored as a GitHub secret; the repo is public.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Throwaway values, not sensitive.
      APP_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # LayoutProps/PageProps are generated by Next; a clean checkout has none.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
